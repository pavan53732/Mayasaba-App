name: Storage invariants
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/storage-tests.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/storage-tests.yml'
  workflow_dispatch:
jobs:
  sqlite-store:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and test SQLite storage (portable unit layer only)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread native/Mayasaba/Storage.cpp native/tests/storage_tests.cpp -lsqlite3 -o /tmp/mayasaba-store-tests
          /tmp/mayasaba-store-tests
